name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Docker Hub repository, from the DOCKERHUB_USERNAME variable
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/unbound-stats
  # Build summary and record upload rely on GitHub only APIs; disabled for Gitea
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    # Runs only where DOCKERHUB_USERNAME is set, so a mirror without it never publishes
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU emulation for the arm64 build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Local amd64 build for the scan; its layers are reused by the push build
      - name: Build for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: unbound-stats:scan

      # SCA scan with Grype; fails on CRITICAL or HIGH vulnerabilities that have a fix
      - name: Scan image
        uses: anchore/scan-action@v7.4.2
        with:
          image: unbound-stats:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # Tags: latest on main, version numbers on v* tags
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # Pull requests only build; nothing is pushed
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
